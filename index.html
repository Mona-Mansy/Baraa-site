<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Boblox 3D Online</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            color: #fff;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* UI Overlay & Containers */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 15, 26, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .card {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            border: 2px solid #e94560;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #e94560;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #0f3460;
        }

        .input-group input, .setting-item select, .setting-item input[type="range"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #0f3460;
            background: #0f3460;
            color: #fff;
            outline: none;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #e94560;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #ff6b81;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #e94560;
            color: #e94560;
        }

        .btn-secondary:hover {
            background: rgba(233, 69, 96, 0.1);
        }

        .btn-warning {
            background: #f39c12;
        }
        .btn-warning:hover {
            background: #f1c40f;
        }

        .btn-danger {
            background: #ff4757;
            margin-top: 10px;
        }
        .btn-danger:hover {
            background: #ff6b81;
        }

        /* Lobby New Navbar & Design */
        .lobby-container {
            background: #16213e;
            border-radius: 20px;
            width: 850px;
            max-width: 95%;
            height: 620px;
            max-height: 95%;
            display: flex;
            flex-direction: column;
            border: 2px solid #e94560;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .navbar {
            background: #0f3460;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: 2px solid #e94560;
        }

        .navbar h2 {
            color: #e94560;
            margin: 0;
            font-size: 26px;
            font-weight: 900;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            transition: 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            color: white;
            border-bottom: 3px solid #e94560;
        }

        .nav-right {
            margin-left: auto;
        }

        .tab-content {
            padding: 30px;
            flex: 1;
            overflow-y: auto;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(15, 52, 96, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: #00a8ff;
            border-radius: 50%;
            border: 3px solid #e94560;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
        }

        .profile-info h3 { font-size: 24px; margin-bottom: 5px; color: white; }
        .profile-info p { color: #aaa; font-size: 14px; }

        .section-title {
            font-size: 20px;
            color: #e94560;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
            padding-bottom: 5px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #0f3460;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .game-card:hover {
            border-color: #e94560;
            transform: translateY(-5px);
            background: rgba(233, 69, 96, 0.1);
        }

        .game-card h4 { font-size: 18px; margin-bottom: 10px; color: #fff; }
        .game-card p { font-size: 13px; color: #aaa; margin-bottom: 15px; }

        /* HUD Game UI */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        #hud * {
            pointer-events: auto;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-icon {
            background: #0f3460;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid #e94560;
            color: white;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-icon:hover {
            background: #e94560;
            transform: scale(1.05);
        }

        .btn-tp {
            display: none; 
            background: #8e44ad;
            border-color: #9b59b6;
        }

        /* Chat System */
        .chat-wrapper {
            position: absolute;
            top: 80px;
            left: 20px;
            width: 300px;
        }

        .chat-container {
            background: rgba(15, 22, 42, 0.75);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(5px);
        }

        .chat-messages {
            height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 6px;
            word-break: break-word;
        }

        .chat-msg span {
            font-weight: bold;
            color: #fffa65;
        }

        .chat-input-box {
            display: flex;
            gap: 5px;
        }

        .chat-input-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            outline: none;
        }

        /* Modals Structure */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 16px;
            width: 340px;
            padding: 22px;
            display: none;
            z-index: 20;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .modal-header h3 { margin: 0; color: #e94560; font-size: 20px; }

        .modal-close {
            background: #ff4757;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .setting-item label {
            font-weight: 500;
        }

        .setting-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #e94560;
        }

        .setting-item select, .setting-item input[type="range"] {
            width: 140px;
            padding: 6px;
        }

        #tp-player-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
        }

        .tp-player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
        }

        .tp-player-item button {
            background: #e94560;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 5px;
            font-weight: bold;
        }

        /* Mobile Controls */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: #e94560;
            border-radius: 50%;
            transition: 0.05s ease-out;
        }

        #btn-jump {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(233, 69, 96, 0.85);
            border: 2px solid #fff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Auth Screen -->
    <div id="auth-screen" class="overlay">
        <!-- Login Form -->
        <div id="login-card" class="card">
            <h2>Boblox Login</h2>
            <div class="input-group">
                <input type="text" id="login-username" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Password">
            </div>
            <button class="btn" onclick="handleLogin()">Log In</button>
            <button class="btn btn-secondary" onclick="toggleAuth(false)">Create New Account</button>
        </div>

        <!-- Register Form -->
        <div id="register-card" class="card" style="display: none;">
            <h2>New Account</h2>
            <div class="input-group">
                <input type="text" id="reg-username" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="reg-password" placeholder="Password">
            </div>
            <div class="input-group">
                <input type="password" id="reg-confirm" placeholder="Confirm Password">
            </div>
            <button class="btn" onclick="handleRegister()">Register</button>
            <button class="btn btn-secondary" onclick="toggleAuth(true)">Already have an account?</button>
        </div>
    </div>

    <!-- Lobby Screen (Updated with Home & Games Navbar) -->
    <div id="lobby-screen" class="overlay" style="display: none;">
        <div class="lobby-container">
            <div class="navbar">
                <h2>Boblox</h2>
                <button class="nav-btn active" id="btn-tab-home" onclick="switchTab('home')">Home</button>
                <button class="nav-btn" id="btn-tab-games" onclick="switchTab('games')">Games</button>
                <div class="nav-right">
                    <button class="btn btn-secondary" style="margin: 0; padding: 6px 15px; font-size: 14px;" onclick="logout()">Log Out</button>
                </div>
            </div>

            <!-- Home Tab -->
            <div id="tab-home" class="tab-content">
                <div class="profile-section">
                    <div class="profile-avatar">👤</div>
                    <div class="profile-info">
                        <h3 id="welcome-user">Player Name</h3>
                        <p>Status: Online & Ready</p>
                    </div>
                </div>

                <h3 class="section-title">Recently Played Games</h3>
                <div class="game-grid">
                    <div class="game-card" onclick="enterGame('public_main')">
                        <h4>Boblox World 3D</h4>
                        <p>Main Public Server</p>
                        <button class="btn" style="padding: 6px;">Play Now</button>
                    </div>
                </div>
                <button class="btn btn-danger" style="margin-top: 30px; width: 200px;" onclick="deleteAccount()">Delete Account</button>
            </div>

            <!-- Games Tab -->
            <div id="tab-games" class="tab-content" style="display: none;">
                <h3 class="section-title">Public Servers & Worlds</h3>
                <div class="game-grid">
                    <div class="game-card" onclick="enterGame('public_main')">
                        <h4>🌍 Boblox Public Server</h4>
                        <p>Join the main public server and meet other players online!</p>
                        <button class="btn">Join Public Server</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD Overlay -->
    <div id="hud">
        <div class="top-bar">
            <button class="btn-icon" id="btn-settings" onclick="openSettingsModal()" title="Settings">⚙️</button>
            <button class="btn-icon" id="btn-chat-toggle" onclick="toggleChatWindow()" title="Toggle Chat">💬</button>
            <button id="btn-tp" class="btn-icon btn-tp" onclick="openTpMenu()" title="Admin TP Menu">⚡</button>
        </div>

        <!-- Chat Container -->
        <div class="chat-wrapper">
            <div class="chat-container" id="chat-box">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="Type a message...">
                    <button class="btn" style="width: auto; padding: 6px 14px; margin:0; font-size:14px;" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="modal-close" onclick="closeSettingsModal()">✕</button>
            </div>
            <div class="setting-item">
                <label>Shift Lock</label>
                <input type="checkbox" id="setting-shiftlock" onchange="toggleShiftLock(this.checked)">
            </div>
            <div class="setting-item">
                <label>Graphics Quality</label>
                <select id="setting-graphics" onchange="changeGraphics(this.value)">
                    <option value="high" selected>High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Sensitivity</label>
                <input type="range" id="setting-sensitivity" min="0.2" max="3" step="0.1" value="1" oninput="updateSensitivity(this.value)">
            </div>
            <div class="setting-item">
                <label>Volume</label>
                <input type="range" id="setting-volume" min="0" max="100" value="80" oninput="updateVolume(this.value)">
            </div>
            <button class="btn btn-warning" onclick="resetCharacter()">Reset Character</button>
            <button class="btn btn-danger" onclick="leaveServer()">Leave Server</button>
        </div>

        <!-- Admin TP/Bring Modal -->
        <div id="tp-modal" class="modal">
            <div class="modal-header">
                <h3>Player Management</h3>
                <button class="modal-close" onclick="closeTpMenu()">✕</button>
            </div>
            <div id="tp-player-list"></div>
        </div>

        <!-- Touch Controls -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="btn-jump">JUMP</div>
    </div>

    <script>
        // --- Firebase Config & Init ---
        const firebaseConfig = {
            apiKey: "AIzaSyBG9Z-V4kz08kfhK_5m9rA2EWuDcAZdDZo",
            authDomain: "boblox-7ad75.firebaseapp.com",
            projectId: "boblox-7ad75",
            storageBucket: "boblox-7ad75.firebasestorage.app",
            messagingSenderId: "346367424808",
            appId: "1:346367424808:web:07871531fefd56d3f2381d",
            measurementId: "G-2R0TMYCLK2",
            databaseURL: "https://boblox-7ad75-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = null;

        // --- Settings Options ---
        let shiftLockEnabled = false;
        let cameraSensitivity = 1.0;
        let audioVolume = 0.8;

        // --- Authentication ---
        function toggleAuth(showLogin) {
            document.getElementById('login-card').style.display = showLogin ? 'block' : 'none';
            document.getElementById('register-card').style.display = showLogin ? 'none' : 'block';
        }

        function handleRegister() {
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (!user || !pass) return alert("Please fill in all fields.");
            if (pass !== confirm) return alert("Passwords do not match.");

            const userRef = db.ref('users/' + user);
            userRef.once('value', snapshot => {
                if (snapshot.exists()) {
                    alert("Username is already taken!");
                } else {
                    userRef.set({ password: pass }).then(() => {
                        alert("Account created successfully!");
                        currentUser = user;
                        showLobby();
                    });
                }
            });
        }

        function handleLogin() {
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value;

            if (!user || !pass) return alert("Please fill in all fields.");

            db.ref('users/' + user).once('value', snapshot => {
                if (snapshot.exists() && snapshot.val().password === pass) {
                    currentUser = user;
                    showLobby();
                } else {
                    alert("Incorrect username or password.");
                }
            });
        }

        function deleteAccount() {
            if (confirm("Are you sure you want to delete your account permanently?")) {
                db.ref('users/' + currentUser).remove().then(() => {
                    alert("Account deleted successfully.");
                    logout();
                });
            }
        }

        function showLobby() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            document.getElementById('welcome-user').innerText = currentUser;
            switchTab('home');
        }

        function logout() {
            currentUser = null;
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        function switchTab(tabName) {
            document.getElementById('tab-home').style.display = tabName === 'home' ? 'block' : 'none';
            document.getElementById('tab-games').style.display = tabName === 'games' ? 'block' : 'none';
            document.getElementById('btn-tab-home').classList.toggle('active', tabName === 'home');
            document.getElementById('btn-tab-games').classList.toggle('active', tabName === 'games');
        }

        // --- Server Joining & Leaving ---
        function enterGame() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            
            if (currentUser === 'baraa') {
                document.getElementById('btn-tp').style.display = 'flex';
            } else {
                document.getElementById('btn-tp').style.display = 'none';
            }
            
            db.ref('players').once('value', snapshot => {
                if (!snapshot.exists() || snapshot.numChildren() === 0) {
                    db.ref('chat').remove();
                }
            });

            document.getElementById('chat-messages').innerHTML = '';
            init3DGame();
        }

        function cleanupServerOnLeave() {
            if (Object.keys(remotePlayers).length === 0) {
                db.ref('chat').remove();
            }
        }

        function leaveServer() {
            if (localPlayerNode) localPlayerNode.remove();
            cleanupServerOnLeave();
            
            closeSettingsModal();
            closeTpMenu();

            document.getElementById('hud').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            document.getElementById('chat-messages').innerHTML = '';
            
            stopGameLoop();
        }

        window.addEventListener('beforeunload', () => {
            if (localPlayerNode) localPlayerNode.remove();
            cleanupServerOnLeave();
        });

        // --- HUD & Settings Interactions ---
        function toggleChatWindow() {
            const chatBox = document.getElementById('chat-box');
            chatBox.style.display = (chatBox.style.display === 'none') ? 'flex' : 'none';
        }

        function openSettingsModal() {
            document.getElementById('settings-modal').style.display = 'block';
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function toggleShiftLock(enabled) {
            shiftLockEnabled = enabled;
        }

        function changeGraphics(val) {
            if (!renderer) return;
            if (val === 'high') {
                renderer.setPixelRatio(window.devicePixelRatio);
            } else if (val === 'medium') {
                renderer.setPixelRatio(1);
            } else if (val === 'low') {
                renderer.setPixelRatio(0.75);
            }
        }

        function updateSensitivity(val) {
            cameraSensitivity = parseFloat(val);
        }

        function updateVolume(val) {
            audioVolume = parseFloat(val) / 100;
        }

        function resetCharacter() {
            if (localPlayerGroup) {
                localPlayerGroup.position.set(0, 0, 0);
                verticalVelocity = 0;
            }
            closeSettingsModal();
        }

        function openTpMenu() {
            const modal = document.getElementById('tp-modal');
            const list = document.getElementById('tp-player-list');
            list.innerHTML = '';
            
            const players = Object.keys(remotePlayers);
            if (players.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#ccc;">No other players online.</p>';
            } else {
                players.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'tp-player-item';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.innerText = p;
                    
                    const btnGroup = document.createElement('div');
                    
                    const tpBtn = document.createElement('button');
                    tpBtn.innerText = 'TP';
                    tpBtn.onclick = () => {
                        const target = remotePlayers[p];
                        if (target && localPlayerGroup) {
                            localPlayerGroup.position.copy(target.position);
                            closeTpMenu();
                        }
                    };
                    
                    const bringBtn = document.createElement('button');
                    bringBtn.innerText = 'Bring';
                    bringBtn.onclick = () => {
                        if (localPlayerGroup) {
                            db.ref('players/' + p + '/teleportTo').set({
                                x: localPlayerGroup.position.x,
                                y: localPlayerGroup.position.y + 2,
                                z: localPlayerGroup.position.z
                            });
                            closeTpMenu();
                        }
                    };
                    
                    btnGroup.appendChild(tpBtn);
                    btnGroup.appendChild(bringBtn);
                    
                    item.appendChild(nameSpan);
                    item.appendChild(btnGroup);
                    list.appendChild(item);
                });
            }
            modal.style.display = 'block';
        }

        function closeTpMenu() {
            document.getElementById('tp-modal').style.display = 'none';
        }

        // --- Three.js 3D Game Engine ---
        let scene, camera, renderer, animationFrameId;
        let localPlayerGroup, localPlayerNode;
        let remotePlayers = {};
        let keys = {};
        let moveVector = { x: 0, z: 0 };
        let isJumping = false, verticalVelocity = 0;
        const gravity = -0.015;

        let cameraAngleX = 0, cameraAngleY = 0.3;
        let isDraggingCamera = false;
        let cameraTouchId = null;
        let lastTouchX = 0, lastTouchY = 0;

        function createTextureCanvas(text, isFace) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#00a8ff';
            ctx.fillRect(0, 0, 256, 256);

            if (isFace) {
                ctx.fillStyle = '#2d3436';
                ctx.beginPath(); ctx.arc(128, 80, 90, Math.PI, 0); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(80, 120, 15, 0, Math.PI * 2);
                ctx.arc(176, 120, 15, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 10; ctx.beginPath();
                ctx.arc(128, 140, 50, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 50px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(text, 128, 140);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function buildCharacterMesh(username) {
            const group = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ map: createTextureCanvas("boblox", false), roughness: 0.3 });
            const headMat = new THREE.MeshStandardMaterial({ map: createTextureCanvas("", true), roughness: 0.3 });
            const limbMat = new THREE.MeshStandardMaterial({ color: 0x00a8ff, roughness: 0.4 });

            const headGeo = new THREE.SphereGeometry(0.5, 32, 16);
            headGeo.scale(1, 0.9, 1);
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.4;
            group.add(head);

            const torsoGeo = new THREE.BoxGeometry(0.8, 1, 0.4);
            const torso = new THREE.Mesh(torsoGeo, bodyMat);
            torso.position.y = 0.6;
            group.add(torso);

            const limbGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.8, 16);
            
            const leftArm = new THREE.Mesh(limbGeo, limbMat);
            leftArm.position.set(-0.6, 0.6, 0); leftArm.name = "leftArm"; group.add(leftArm);
            
            const rightArm = new THREE.Mesh(limbGeo, limbMat);
            rightArm.position.set(0.6, 0.6, 0); rightArm.name = "rightArm"; group.add(rightArm);
            
            const leftLeg = new THREE.Mesh(limbGeo, limbMat);
            leftLeg.position.set(-0.25, -0.2, 0); leftLeg.name = "leftLeg"; group.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(limbGeo, limbMat);
            rightLeg.position.set(0.25, -0.2, 0); rightLeg.name = "rightLeg"; group.add(rightLeg);

            const nameCanvas = document.createElement('canvas');
            const nameCtx = nameCanvas.getContext('2d');
            nameCanvas.width = 256; nameCanvas.height = 64;
            nameCtx.fillStyle = 'white';
            nameCtx.font = 'bold 30px Arial';
            nameCtx.textAlign = 'center';
            nameCtx.fillText(username, 128, 40);
            
            const nameTex = new THREE.CanvasTexture(nameCanvas);
            const labelMat = new THREE.SpriteMaterial({ map: nameTex });
            const label = new THREE.Sprite(labelMat);
            label.position.set(0, 2.2, 0);
            label.scale.set(1.5, 0.4, 1);
            group.add(label);

            return group;
        }

        function displayChatBubble(targetGroup, messageText) {
            if (!targetGroup) return;
            const existingBubble = targetGroup.getObjectByName("chatBubble");
            if (existingBubble) targetGroup.remove(existingBubble);

            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 6;
            
            const x = 10, y = 10, w = 492, h = 90, r = 20;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            
            let truncated = messageText.length > 30 ? messageText.substring(0, 27) + "..." : messageText;
            ctx.fillText(truncated, 256, 62);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture });
            const bubbleSprite = new THREE.Sprite(spriteMat);
            
            bubbleSprite.name = "chatBubble";
            bubbleSprite.position.set(0, 2.9, 0);
            bubbleSprite.scale.set(2.8, 0.7, 1);

            targetGroup.add(bubbleSprite);

            setTimeout(() => {
                if (targetGroup.getObjectByName("chatBubble") === bubbleSprite) {
                    targetGroup.remove(bubbleSprite);
                }
            }, 5000);
        }

        function createMap() {
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x4bc050 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            for (let i = 0; i < 30; i++) {
                const house = new THREE.Group();
                const x = (Math.random() - 0.5) * 150;
                const z = (Math.random() - 0.5) * 150;

                const boxGeo = new THREE.BoxGeometry(6, 4, 6);
                const boxMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                const houseBase = new THREE.Mesh(boxGeo, boxMat);
                houseBase.position.y = 2;
                house.add(houseBase);

                const roofGeo = new THREE.ConeGeometry(5, 3, 4);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0xe94560 });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 5.5;
                roof.rotation.y = Math.PI / 4;
                house.add(roof);

                house.position.set(x, 0, z);
                scene.add(house);
            }
        }

        function init3DGame() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            createMap();

            localPlayerGroup = buildCharacterMesh(currentUser);
            scene.add(localPlayerGroup);

            localPlayerNode = db.ref('players/' + currentUser);
            localPlayerNode.onDisconnect().remove();

            setupControls();
            listenToMultiplayer();
            listenToChat();
            
            db.ref('players/' + currentUser + '/teleportTo').on('value', snap => {
                if (snap.exists()) {
                    const pos = snap.val();
                    localPlayerGroup.position.set(pos.x, pos.y, pos.z);
                    verticalVelocity = 0;
                    db.ref('players/' + currentUser + '/teleportTo').remove();
                }
            });

            startGameLoop();
        }

        function setupControls() {
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            const canvas = document.getElementById('game-canvas');

            canvas.addEventListener('mousedown', e => {
                isDraggingCamera = true;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDraggingCamera = false);
            window.addEventListener('mousemove', e => {
                if (isDraggingCamera) {
                    const deltaX = (e.clientX - lastTouchX) * 0.005 * cameraSensitivity;
                    const deltaY = (e.clientY - lastTouchY) * 0.005 * cameraSensitivity;
                    cameraAngleX -= deltaX;
                    cameraAngleY += deltaY;
                    cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY));
                    lastTouchX = e.clientX;
                    lastTouchY = e.clientY;
                }
            });

            window.addEventListener('touchstart', e => {
                for (let touch of e.changedTouches) {
                    if (e.target.closest('#hud *')) continue;
                    if (cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === cameraTouchId) {
                        const deltaX = (touch.clientX - lastTouchX) * 0.005 * cameraSensitivity;
                        const deltaY = (touch.clientY - lastTouchY) * 0.005 * cameraSensitivity;
                        cameraAngleX -= deltaX;
                        cameraAngleY += deltaY;
                        cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY));
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            });

            const clearTouch = e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === cameraTouchId) cameraTouchId = null;
                }
            };
            window.addEventListener('touchend', clearTouch);
            window.addEventListener('touchcancel', clearTouch);

            const knob = document.getElementById('joystick-knob');
            const zone = document.getElementById('joystick-zone');
            let joystickTouchId = null;

            zone.addEventListener('touchstart', e => {
                e.stopPropagation();
                joystickTouchId = e.changedTouches[0].identifier;
            });

            zone.addEventListener('touchmove', e => {
                e.stopPropagation();
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        const rect = zone.getBoundingClientRect();
                        const dx = touch.clientX - (rect.left + 60);
                        const dy = touch.clientY - (rect.top + 60);
                        const dist = Math.min(Math.hypot(dx, dy), 40);
                        const angle = Math.atan2(dy, dx);

                        knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                        moveVector.x = Math.cos(angle) * (dist / 40);
                        moveVector.z = Math.sin(angle) * (dist / 40);
                    }
                }
            });

            const resetJoystick = e => {
                if (e) e.stopPropagation();
                knob.style.transform = 'translate(0px, 0px)';
                moveVector = { x: 0, z: 0 };
            };
            zone.addEventListener('touchend', resetJoystick);
            zone.addEventListener('touchcancel', resetJoystick);

            document.getElementById('btn-jump').addEventListener('click', jump);
        }

        function jump() {
            if (!isJumping) {
                verticalVelocity = 0.3;
                isJumping = true;
            }
        }

        let walkCycle = 0;

        function updatePlayerPhysics() {
            let dx = 0, dz = 0;

            if (keys['KeyW'] || keys['ArrowUp']) dz -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dz += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
            if (keys['Space']) jump();

            if (moveVector.x !== 0 || moveVector.z !== 0) {
                dx = moveVector.x;
                dz = moveVector.z;
            }

            if (dx !== 0 || dz !== 0) {
                // FIXED MOVEMENT VECTORS: Corrected math signs to fix forward/backward and left/right inversion.
                const forward = new THREE.Vector3(-Math.sin(cameraAngleX), 0, -Math.cos(cameraAngleX));
                const side = new THREE.Vector3(Math.cos(cameraAngleX), 0, -Math.sin(cameraAngleX));

                const moveDir = new THREE.Vector3()
                    .addScaledVector(forward, -dz)
                    .addScaledVector(side, dx)
                    .normalize();

                localPlayerGroup.position.x += moveDir.x * 0.15;
                localPlayerGroup.position.z += moveDir.z * 0.15;

                if (shiftLockEnabled) {
                    localPlayerGroup.rotation.y = cameraAngleX + Math.PI;
                } else {
                    localPlayerGroup.rotation.y = Math.atan2(moveDir.x, moveDir.z);
                }

                walkCycle += 0.2;
                localPlayerGroup.getObjectByName("leftArm").rotation.x = Math.sin(walkCycle) * 0.5;
                localPlayerGroup.getObjectByName("rightArm").rotation.x = -Math.sin(walkCycle) * 0.5;
                localPlayerGroup.getObjectByName("leftLeg").rotation.x = -Math.sin(walkCycle) * 0.5;
                localPlayerGroup.getObjectByName("rightLeg").rotation.x = Math.sin(walkCycle) * 0.5;
            }

            localPlayerGroup.position.y += verticalVelocity;
            verticalVelocity += gravity;

            if (localPlayerGroup.position.y <= 0) {
                localPlayerGroup.position.y = 0;
                verticalVelocity = 0;
                isJumping = false;
            }

            const camDistance = 8;
            camera.position.x = localPlayerGroup.position.x + camDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.y = localPlayerGroup.position.y + camDistance * Math.sin(cameraAngleY) + 1;
            camera.position.z = localPlayerGroup.position.z + camDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
            camera.lookAt(localPlayerGroup.position.x, localPlayerGroup.position.y + 1, localPlayerGroup.position.z);

            if (localPlayerNode) {
                localPlayerNode.update({
                    x: localPlayerGroup.position.x,
                    y: localPlayerGroup.position.y,
                    z: localPlayerGroup.position.z,
                    rotY: localPlayerGroup.rotation.y,
                    username: currentUser
                });
            }
        }

        function startGameLoop() {
            function loop() {
                updatePlayerPhysics();
                renderer.render(scene, camera);
                animationFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function stopGameLoop() {
            cancelAnimationFrame(animationFrameId);
        }

        function listenToMultiplayer() {
            db.ref('players').on('child_added', snapshot => {
                const user = snapshot.key;
                if (user !== currentUser && !remotePlayers[user]) {
                    const remoteGroup = buildCharacterMesh(user);
                    scene.add(remoteGroup);
                    remotePlayers[user] = remoteGroup;
                }
            });

            db.ref('players').on('child_changed', snapshot => {
                const user = snapshot.key;
                const data = snapshot.val();
                if (remotePlayers[user] && user !== currentUser) {
                    remotePlayers[user].position.set(data.x, data.y, data.z);
                    remotePlayers[user].rotation.y = data.rotY;
                }
            });

            db.ref('players').on('child_removed', snapshot => {
                const user = snapshot.key;
                if (remotePlayers[user]) {
                    scene.remove(remotePlayers[user]);
                    delete remotePlayers[user];
                }
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            db.ref('chat').push({
                user: currentUser,
                text: msg,
                time: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = '';
        }

        function listenToChat() {
            const chatBox = document.getElementById('chat-messages');
            db.ref('chat').limitToLast(20).on('child_added', snapshot => {
                const data = snapshot.val();
                
                const msgElement = document.createElement('div');
                msgElement.className = 'chat-msg';
                msgElement.innerHTML = `<span>${data.user}:</span> ${data.text}`;
                chatBox.appendChild(msgElement);
                chatBox.scrollTop = chatBox.scrollHeight;

                let pGroup = null;
                if (data.user === currentUser) {
                    pGroup = localPlayerGroup;
                } else if (remotePlayers[data.user]) {
                    pGroup = remotePlayers[data.user];
                }

                if (pGroup) {
                    displayChatBubble(pGroup, data.text);
                }
            });
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
